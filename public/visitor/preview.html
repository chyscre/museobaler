<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visitor App · Device Preview</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#16181c; --panel:#1e2127; --line:#2e323a;
    --ink:#e8eaed; --dim:#9aa0a8; --accent:#7BAE5A; --accent-d:#4A7C2F;
  }
  html,body{height:100%}
  body{
    font:13px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    background:var(--bg); color:var(--ink);
    display:flex; flex-direction:column; overflow:hidden;
  }

  /* ── TOOLBAR ── */
  header{
    flex-shrink:0; background:var(--panel); border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:18px; padding:10px 16px; flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.01em}
  .brand .dot{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--accent-d));flex-shrink:0}
  .brand small{display:block;font-weight:400;font-size:10.5px;color:var(--dim);letter-spacing:0}
  .group{display:flex;align-items:center;gap:7px}
  .group > label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
  select,input[type=number],button{
    font:inherit; color:var(--ink); background:#282c34;
    border:1px solid var(--line); border-radius:7px; padding:5px 9px;
  }
  input[type=number]{width:66px}
  button{cursor:pointer}
  button:hover{border-color:#4a505c}
  button.on{background:var(--accent-d);border-color:var(--accent);color:#fff;font-weight:600}
  .seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
  .seg button{border:0;border-radius:0;padding:5px 11px}
  .seg button+button{border-left:1px solid var(--line)}
  .spacer{flex:1}

  /* ── STAGE ── */
  main{
    flex:1; overflow:auto; padding:26px 22px 60px;
    background:
      radial-gradient(circle at 1px 1px, #262a31 1px, transparent 0) 0 0/22px 22px,
      var(--bg);
  }
  .rack{display:flex;flex-wrap:wrap;gap:30px;align-items:flex-start;justify-content:center}

  .device{display:flex;flex-direction:column;align-items:center;gap:9px}
  .label{font-size:11.5px;color:var(--dim);text-align:center;white-space:nowrap}
  .label b{color:var(--ink);font-weight:600}
  .label span{font-variant-numeric:tabular-nums}

  /* The shell is sized to the device in real CSS pixels; `scale` only shrinks
     it to fit the desk, so the page inside still sees the device's width. */
  /* content-box, deliberately: the width/height set on .shell is the device's
     viewport, and the bezel padding has to sit OUTSIDE it. With the inherited
     border-box the padding was subtracted instead, so a frame labelled 390×844
     was handing the page 374×828 — every measurement 16px short. */
  .shell{position:relative;box-sizing:content-box;background:#000;box-shadow:0 10px 34px rgba(0,0,0,.5);transform-origin:top center}
  .shell.phone{border-radius:38px;padding:8px}
  .shell.tablet{border-radius:24px;padding:10px}
  .shell iframe{display:block;border:0;background:#fff;width:100%;height:100%}
  .shell.phone iframe{border-radius:31px}
  .shell.tablet iframe{border-radius:15px}

  /* Cosmetic, so the simulated safe areas read as a notch and a home indicator
     rather than as unexplained gaps. */
  .notch{
    position:absolute; top:8px; left:50%; transform:translateX(-50%);
    width:44%; height:30px; background:#000; border-radius:0 0 18px 18px;
    z-index:5; pointer-events:none;
  }
  .home-bar{
    position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
    width:36%; height:4px; background:rgba(255,255,255,.55); border-radius:2px;
    z-index:5; pointer-events:none;
  }

  /* ── PHONE HAND-OFF ── */
  .handoff{
    position:fixed; right:18px; bottom:18px; width:238px;
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:14px; box-shadow:0 12px 34px rgba(0,0,0,.5); z-index:50;
  }
  .handoff h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin-bottom:10px;font-weight:600}
  .handoff canvas{width:100%;height:auto;border-radius:8px;background:#fff;display:block;margin-bottom:10px}
  .handoff code{
    display:block; font-size:10.5px; color:var(--accent);
    word-break:break-all; line-height:1.5; margin-bottom:9px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  .handoff .row{display:flex;gap:6px}
  .handoff button{flex:1;font-size:11.5px;padding:5px 6px}
  .handoff .hide{position:absolute;top:8px;right:8px;background:none;border:0;color:var(--dim);padding:2px 6px}
  .note{font-size:10.5px;color:var(--dim);line-height:1.5;margin-top:9px}
  #show-handoff{position:fixed;right:18px;bottom:18px;z-index:50;display:none}
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="dot"></span>
    <span>Visitor App<small>device preview</small></span>
  </div>

  <div class="group">
    <label for="preset">Devices</label>
    <select id="preset"></select>
  </div>

  <div class="group">
    <label>Custom</label>
    <input type="number" id="cw" min="240" max="2000" value="390" title="width in CSS pixels">
    <span style="color:var(--dim)">×</span>
    <input type="number" id="ch" min="320" max="2000" value="844" title="height in CSS pixels">
    <button id="add-custom">Add</button>
  </div>

  <div class="seg" id="orient">
    <button data-o="portrait" class="on">Portrait</button>
    <button data-o="landscape">Landscape</button>
  </div>

  <div class="group">
    <label for="zoom">Fit</label>
    <select id="zoom">
      <option value="auto">auto</option>
      <option value="1">100%</option>
      <option value="0.75">75%</option>
      <option value="0.5">50%</option>
      <option value="0.35">35%</option>
    </select>
  </div>

  <div class="spacer"></div>

  <button id="notch-toggle" title="Feed the frames the safe-area values a notched iPhone reports, so the notch and home-indicator padding can be checked from a desktop">Simulate notch</button>
  <button id="debug-toggle" title="Show the app's own viewport readout inside each frame">Debug badge</button>
  <button id="reload">Reload all</button>
</header>

<main>
  <div class="rack" id="rack"></div>
</main>

<div class="handoff" id="handoff">
  <button class="hide" id="hide-handoff" title="Hide">✕</button>
  <h2>Open on a phone</h2>
  <canvas id="qr" width="210" height="210"></canvas>
  <code id="url"></code>
  <div class="row">
    <button id="copy">Copy link</button>
    <button id="copy-debug">Copy + debug</button>
  </div>
  <p class="note" id="lan-note"></p>
</div>
<button id="show-handoff">Open on a phone</button>

<script src="../js/qrcode.min.js"></script>
<script>
'use strict';

/* ───────────────────────────────────────────────────────────
   Device preview for the visitor app.

   Every size below is the CSS-pixel viewport the browser reports on that
   handset — not its hardware resolution — because CSS pixels are what the
   media queries in css/app.css are actually tested against.
   ─────────────────────────────────────────────────────────── */
const DEVICES = [
  { id:'small',   name:'Small Android',       w:320, h:640,  kind:'phone',  notch:false },
  { id:'s8',      name:'Galaxy S8 / A-class', w:360, h:740,  kind:'phone',  notch:false },
  { id:'se',      name:'iPhone SE',           w:375, h:667,  kind:'phone',  notch:false },
  { id:'i13',     name:'iPhone 13 / 14',      w:390, h:844,  kind:'phone',  notch:true  },
  { id:'pixel',   name:'Pixel 7',             w:412, h:915,  kind:'phone',  notch:true  },
  { id:'i15pm',   name:'iPhone 15 Pro Max',   w:430, h:932,  kind:'phone',  notch:true  },
  { id:'fold',    name:'Z Fold (unfolded)',   w:690, h:829,  kind:'tablet', notch:false },
  { id:'ipadmini',name:'iPad mini',           w:744, h:1133, kind:'tablet', notch:false },
  { id:'ipadpro', name:'iPad Pro 11"',        w:834, h:1194, kind:'tablet', notch:false },
];

// Phones is the default set: it is what visitors will be holding in the museum.
const SETS = {
  phones:   ['small','s8','se','i13','pixel','i15pm'],
  narrow:   ['small','s8','se'],
  tablets:  ['fold','ipadmini','ipadpro'],
  all:      DEVICES.map(function(d){ return d.id; }),
  i13:      ['i13'],
  se:       ['se'],
  ipadmini: ['ipadmini'],
};

/* The toolbar state also lives in the query string, so a particular view —
   "narrow phones, landscape, notch on" — can be bookmarked, shared, or opened
   straight from a script. */
const params = new URLSearchParams(location.search);
const state = {
  set: SETS[params.get('set')] ? params.get('set') : 'phones',
  extra: [],                 // custom sizes added from the toolbar
  orientation: params.get('orientation') === 'landscape' ? 'landscape' : 'portrait',
  zoom: params.get('zoom') || 'auto',
  notch: params.get('notch') === '1',
  debug: params.get('debug') === '1',
};

function syncUrl(){
  const q = new URLSearchParams();
  if (state.set !== 'phones')          q.set('set', state.set);
  if (state.orientation !== 'portrait') q.set('orientation', state.orientation);
  if (state.zoom !== 'auto')           q.set('zoom', state.zoom);
  if (state.notch)                     q.set('notch', '1');
  if (state.debug)                     q.set('debug', '1');
  const qs = q.toString();
  history.replaceState(null, '', qs ? location.pathname + '?' + qs : location.pathname);
}

const $ = function(id){ return document.getElementById(id); };
const rack = $('rack');

// ── toolbar: device set picker ──────────────────────────────
(function buildPresets(){
  const opts = [
    ['phones',   'Phones (6)'],
    ['narrow',   'Narrow phones (3)'],
    ['tablets',  'Tablets and foldables (3)'],
    ['all',      'Everything (9)'],
    ['i13',      'iPhone 13 only'],
    ['se',       'iPhone SE only'],
    ['ipadmini', 'iPad mini only'],
  ];
  $('preset').innerHTML = opts.map(function(o){
    return '<option value="' + o[0] + '">' + o[1] + '</option>';
  }).join('');
})();

// ── render ──────────────────────────────────────────────────
function devicesInView(){
  const chosen = SETS[state.set].map(function(id){
    return DEVICES.filter(function(d){ return d.id === id; })[0];
  });
  return chosen.concat(state.extra);
}

function frameSrc(){
  // Cache-busted per render, so "Reload all" genuinely reloads; the debug flag
  // rides along to the app's own viewport badge.
  return './index.html?' + (state.debug ? 'debug=1&' : '') + 't=' + Date.now();
}

function render(){
  syncUrl();
  const list = devicesInView();
  rack.innerHTML = '';

  const land = state.orientation === 'landscape';
  const dims = list.map(function(d){
    return land ? { w:d.h, h:d.w } : { w:d.w, h:d.h };
  });

  // One scale for the whole rack, so the devices stay comparable to each other.
  let scale;
  if (state.zoom === 'auto') {
    const stageW  = rack.clientWidth || (window.innerWidth - 60);
    const stageH  = window.innerHeight - 150;
    const perRow  = Math.max(1, Math.min(list.length, 3));
    const widest  = Math.max.apply(null, dims.map(function(d){ return d.w; }));
    const tallest = Math.max.apply(null, dims.map(function(d){ return d.h; }));
    scale = Math.min(1, (stageW / perRow - 40) / widest, stageH / (tallest + 40));
    scale = Math.max(0.28, scale);
  } else {
    scale = parseFloat(state.zoom);
  }

  list.forEach(function(d, i){
    const w = dims[i].w, h = dims[i].h;

    const wrap = document.createElement('div');
    wrap.className = 'device';
    // A transform does not shrink the space the element reserves in the flow,
    // so reserve the scaled size by hand.
    const bezel = d.kind === 'tablet' ? 20 : 16;   // .shell padding, both sides
    wrap.style.width = Math.round((w + bezel) * scale + 20) + 'px';

    const shell = document.createElement('div');
    shell.className = 'shell ' + d.kind;
    shell.style.width  = w + 'px';
    shell.style.height = h + 'px';
    shell.style.transform = 'scale(' + scale + ')';
    shell.style.marginBottom = Math.round(-((h + bezel) * (1 - scale))) + 'px';

    if (state.notch && d.notch && !land) {
      shell.insertAdjacentHTML('beforeend',
        '<div class="notch"></div><div class="home-bar"></div>');
    }

    const frame = document.createElement('iframe');
    frame.src = frameSrc();
    frame.title = d.name;
    // allow= is what lets the QR scanner inside the frame ask for the camera.
    frame.allow = 'camera; geolocation; microphone';
    frame.addEventListener('load', function(){ applyInsets(frame, d, land); });
    shell.appendChild(frame);

    const label = document.createElement('div');
    label.className = 'label';
    label.innerHTML = '<b>' + d.name + '</b><br><span>' + w + ' × ' + h +
                      '</span> · ' + Math.round(scale * 100) + '%';

    wrap.appendChild(shell);
    wrap.appendChild(label);
    rack.appendChild(wrap);
  });
}

/* env(safe-area-inset-*) only reports real values on real hardware, so a desktop
   preview can never produce one by itself. The frames are same-origin, though,
   so the numbers a notched iPhone would report can be written straight into the
   custom properties the stylesheet reads — enough to check that the header
   clears the notch and the bottom nav clears the home indicator. */
function applyInsets(frame, device, landscape){
  let doc;
  try { doc = frame.contentDocument; } catch (e) { return; }
  if (!doc || !doc.head) return;

  let tag = doc.getElementById('preview-insets');
  if (!tag) {
    tag = doc.createElement('style');
    tag.id = 'preview-insets';
    doc.head.appendChild(tag);
  }

  if (!state.notch || !device.notch) { tag.textContent = ''; return; }

  tag.textContent = landscape
    ? ':root{--safe-t:0px;--safe-b:21px;--safe-l:47px;--safe-r:47px}'
    : ':root{--safe-t:47px;--safe-b:34px;--safe-l:0px;--safe-r:0px}';
}

// ── toolbar wiring ──────────────────────────────────────────
$('preset').addEventListener('change', function(e){
  state.set = e.target.value;
  render();
});

$('add-custom').addEventListener('click', function(){
  const w = Math.max(240, Math.min(2000, parseInt($('cw').value, 10) || 390));
  const h = Math.max(320, Math.min(2000, parseInt($('ch').value, 10) || 844));
  state.extra.push({
    id: 'custom-' + w + 'x' + h,
    name: 'Custom',
    w: w,
    h: h,
    kind: w >= 600 ? 'tablet' : 'phone',
    notch: false,
  });
  render();
});

Array.prototype.forEach.call(document.querySelectorAll('#orient button'), function(b){
  b.addEventListener('click', function(){
    Array.prototype.forEach.call(document.querySelectorAll('#orient button'), function(x){
      x.classList.remove('on');
    });
    b.classList.add('on');
    state.orientation = b.dataset.o;
    render();
  });
});

$('zoom').addEventListener('change', function(e){ state.zoom = e.target.value; render(); });

$('notch-toggle').addEventListener('click', function(e){
  state.notch = !state.notch;
  e.target.classList.toggle('on', state.notch);
  render();
});

$('debug-toggle').addEventListener('click', function(e){
  state.debug = !state.debug;
  e.target.classList.toggle('on', state.debug);
  render();
});

$('reload').addEventListener('click', render);

let resizeTimer;
window.addEventListener('resize', function(){
  if (state.zoom !== 'auto') return;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(render, 180);
});

// ── phone hand-off ──────────────────────────────────────────
// The preview settles layout. The camera, the GPS geofence and the real safe
// areas still need a handset — this is the shortest path to one.
(function handoff(){
  const appUrl = new URL('./index.html', location.href).href;
  $('url').textContent = appUrl;

  if (window.QRCode && QRCode.toCanvas) {
    QRCode.toCanvas($('qr'), appUrl, { width: 210, margin: 1 }, function(){});
  }

  function copy(text, btn, label){
    navigator.clipboard.writeText(text).then(function(){
      const original = btn.textContent;
      btn.textContent = 'Copied';
      setTimeout(function(){ btn.textContent = original; }, 1400);
    }, function(){});
  }
  $('copy').addEventListener('click', function(){ copy(appUrl, $('copy')); });
  $('copy-debug').addEventListener('click', function(){ copy(appUrl + '?debug=1', $('copy-debug')); });

  // localhost and *.test resolve on this machine only. A phone on the same
  // Wi-Fi needs the LAN address, and the camera needs HTTPS anywhere but
  // localhost — which is what the tunnel is for.
  const host = location.hostname;
  const localOnly = host === 'localhost' || host === '127.0.0.1' || host.slice(-5) === '.test';
  $('lan-note').textContent = localOnly
    ? 'This link resolves on this machine only. For a phone, reopen this page on the LAN address or the tunnel URL first — the camera needs HTTPS anywhere but localhost.'
    : 'Scan to open the app on a handset. Add ?debug=1 for the viewport readout.';

  $('hide-handoff').addEventListener('click', function(){
    $('handoff').style.display = 'none';
    $('show-handoff').style.display = 'block';
  });
  $('show-handoff').addEventListener('click', function(){
    $('handoff').style.display = 'block';
    $('show-handoff').style.display = 'none';
  });
})();

// Reflect the restored state in the controls before the first paint.
$('preset').value = state.set;
$('zoom').value   = state.zoom;
$('notch-toggle').classList.toggle('on', state.notch);
$('debug-toggle').classList.toggle('on', state.debug);
Array.prototype.forEach.call(document.querySelectorAll('#orient button'), function(b){
  b.classList.toggle('on', b.dataset.o === state.orientation);
});

render();
</script>
</body>
</html>
