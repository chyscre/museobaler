<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Museo de Baler — Admin Sitemap</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#1a1f2e;font-family:'Segoe UI',Arial,sans-serif;padding:40px 30px 80px;}
h1{text-align:center;font-size:14px;font-weight:600;color:#8ba7d4;margin-bottom:40px;}
.wrap{position:relative;}
svg{position:absolute;top:0;left:0;pointer-events:none;}
.node{position:absolute;border-radius:5px;display:flex;align-items:center;justify-content:center;text-align:center;font-family:'Segoe UI',Arial,sans-serif;line-height:1.3;}
</style>
</head>
<body>
<h1>Museo de Baler — Admin Panel Sitemap</h1>
<div class="wrap" id="wrap"><svg id="svg"></svg></div>
<script>
const RW=160,RH=38,BW=118,BH=34,CW=118,CH=30,SW=118,SH=24;
const BRANCH_GAP=16,C_GAP=10,S_GAP=6,SPEC_HOFFSET=20;
const ROOT_Y=20,BUS_Y=ROOT_Y+RH+48,HEAD_Y=BUS_Y+32,CHILD_START_Y=HEAD_Y+BH+36;
const COL_W=CW+SPEC_HOFFSET+SW;

const BRANCHES=[
  {label:'Login',children:[
    {label:'Login Form',    specs:['Email & password','Error messages','Redirect if authed']},
    {label:'Rate Limiter',  specs:['5 attempts / min','IP-based lockout']},
    {label:'Logout',        specs:['Session destroy','Token regenerate']},
  ]},
  {label:'Dashboard',children:[
    {label:'Stats Cards',      specs:['Visitors / Scans','Feedback / Attendance']},
    {label:'Visitor Chart',    specs:['Monthly trend','12-month rolling bar']},
    {label:'Category Chart',   specs:['By exhibit category','Doughnut chart']},
    {label:'Top Scanned',      specs:['Top 5 exhibits','Sort by scan count']},
    {label:'Least Scanned',    specs:['Bottom 3 exhibits','Low engagement flag']},
    {label:'Feedback Summary', specs:['Avg rating display','Star distribution bars']},
  ]},
  {label:'Exhibits',children:[
    {label:'Exhibit List',    specs:['Sort by storyline','Sort by date added','Filter by hall','Filter by status']},
    {label:'Add Exhibit',     specs:['Exhibit code unique','Hall & floor select','Category assign','Cover image upload']},
    {label:'Translations',    specs:['EN / FIL per exhibit','Audio file upload','Per-language title']},
    {label:'Gallery',         specs:['Multi-image upload','Caption per image','Sort order']},
    {label:'Archive/Restore', specs:['Hide from PWA','Restore to active']},
    {label:'QR Code Print',   specs:['Single QR card','Print all 3-col grid']},
    {label:'Image Recog.',    specs:['Reference photos','Google Vision API','Per-exhibit training']},
  ]},
  {label:'Museum',children:[
    {label:'Museum Info',  specs:['Name & tagline','Story paragraphs','Hours & address']},
    {label:'Manage Halls', specs:['Add / edit / delete','Floor assignment','Icon & sort order']},
    {label:'Museum Map',   specs:['Floor plan view','Exhibit placement','Active / archived count']},
  ]},
  {label:'Records',children:[
    {label:'Visitor List',   specs:['Search by name','Filter by visitor type','Filter by visit type','Sort newest / oldest']},
    {label:'Attendance Log', specs:['Filter by date','Geofence auto-detect','7-day bar chart']},
  ]},
  {label:'Feedback',children:[
    {label:'Feedback List',   specs:['Filter by rating','Sort newest / oldest','Sort highest / lowest','Search by name']},
    {label:'Feedback Detail', specs:['Full comment view','Star rating display','Visitor info panel']},
    {label:'Rating Summary',  specs:['Average rating','Distribution bars']},
  ]},
  {label:'Staff',children:[
    {label:'Staff List',     specs:['Sort by date added','Active / inactive badge']},
    {label:'Add / Edit',     specs:['Name & email','Role assignment','Password rules']},
    {label:'Toggle Status',  specs:['Activate / deactivate','Block self-deactivate']},
    {label:'Notif. Manager', specs:['Create notification','Active / inactive toggle','Type: info/promo/alert']},
  ]},
  {label:'Logs',children:[
    {label:'Audit Log List', specs:['Search by user','Search by action','Filter by date range','Filter by role']},
    {label:'Action Types',   specs:['Exhibit Added/Updated','Staff Added/Updated','Museum Info Updated']},
  ]},
];

const branchX=BRANCHES.map((_,i)=>30+i*(COL_W+BRANCH_GAP));
const branchCx=branchX.map(x=>x+COL_W/2);
const canvasW=30+BRANCHES.length*(COL_W+BRANCH_GAP)-BRANCH_GAP+30;

function childH(c){return Math.max(CH,c.specs.length*SH+(c.specs.length-1)*S_GAP);}
function branchTotalH(b){return b.children.reduce((s,c,i)=>s+childH(c)+(i>0?C_GAP:0),0);}
const canvasH=CHILD_START_Y+Math.max(...BRANCHES.map(branchTotalH))+60;

const wrap=document.getElementById('wrap');
const svg=document.getElementById('svg');
wrap.style.width=canvasW+'px'; wrap.style.height=canvasH+'px';
svg.setAttribute('width',canvasW); svg.setAttribute('height',canvasH);
svg.innerHTML=`<defs>
  <marker id="a1" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#4a72b0"/></marker>
  <marker id="a2" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#2d5a9e"/></marker>
</defs>`;

function L(x1,y1,x2,y2,col,arr){
  const l=document.createElementNS('http://www.w3.org/2000/svg','line');
  l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',x2);l.setAttribute('y2',y2);
  l.setAttribute('stroke',col);l.setAttribute('stroke-width','1.5');
  if(arr)l.setAttribute('marker-end','url(#'+(col==='#4a72b0'?'a1':'a2')+')');
  svg.appendChild(l);
}
function B(x,y,w,h,bg,bd,col,txt,sz,bld){
  const d=document.createElement('div');
  d.className='node';
  d.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:${bg};border:1.5px solid ${bd};color:${col};font-size:${sz}px;font-weight:${bld?700:400};padding:0 4px;`;
  d.textContent=txt;
  wrap.appendChild(d);
}

// Root
const rootX=canvasW/2-RW/2;
B(rootX,ROOT_Y,RW,RH,'#2d4a7a','#6a9fd8','#c8daf5','Admin Panel',13,true);
const rootCx=canvasW/2;
L(rootCx,ROOT_Y+RH,rootCx,BUS_Y,'#4a72b0',false);
L(branchCx[0],BUS_Y,branchCx[branchCx.length-1],BUS_Y,'#4a72b0',false);

BRANCHES.forEach((branch,bi)=>{
  const cx=branchCx[bi];
  const bx=cx-BW/2;
  const childLeft=branchX[bi];
  const railX=childLeft-8;

  L(cx,BUS_Y,cx,HEAD_Y,'#4a72b0',true);
  B(bx,HEAD_Y,BW,BH,'#2d4a7a','#4a72b0','#c8daf5',branch.label,12,true);

  let curY=CHILD_START_Y;
  const mids=[];

  branch.children.forEach((child,ci)=>{
    const ch=childH(child);
    const cmy=curY+CH/2;
    mids.push(cmy);

    L(railX,cmy,childLeft,cmy,'#4a72b0',true);
    B(childLeft,curY,CW,CH,'#2d4a7a','#4a72b0','#c8daf5',child.label,11,false);

    // Specs — aligned to child midY
    const specLeft=childLeft+CW+SPEC_HOFFSET;
    const specRailX=specLeft-8;
    L(childLeft+CW,cmy,specLeft,cmy,'#2d5a9e',true);
    if(child.specs.length>1){
      const lastSMY=cmy+(child.specs.length-1)*(SH+S_GAP);
      L(specRailX,cmy,specRailX,lastSMY,'#2d5a9e',false);
    }
    child.specs.forEach((sp,si)=>{
      const sy=cmy-SH/2+si*(SH+S_GAP);
      const smy=sy+SH/2;
      if(si>0)L(specRailX,smy,specLeft,smy,'#2d5a9e',true);
      B(specLeft,sy,SW,SH,'#172840','#2d5a9e','#7aa3d4',sp,10,false);
    });

    curY+=ch+C_GAP;
  });

  // Vertical from header to first child, then rail through all children
  if(mids.length>0){
    L(cx,HEAD_Y+BH,cx,mids[0],'#4a72b0',false);
    L(cx,mids[0],railX,mids[0],'#4a72b0',false);
    if(mids.length>1)L(railX,mids[0],railX,mids[mids.length-1],'#4a72b0',false);
  }
});
</script>
<div style="text-align:center;margin-top:24px;font-size:11px;color:#4a72b0;">
  Museo de Baler · Admin Panel Sitemap · All Features & Specifications
</div>
</body>
</html>
