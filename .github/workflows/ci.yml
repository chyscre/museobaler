# Continuous integration.
#
# Every push and pull request runs the full test suite and a vulnerability
# audit of both dependency trees. A red run blocks a merge; nothing reaches
# the server that the tests did not pass.
#
# The suite runs on in-memory sqlite (see phpunit.xml), so no database
# service is needed here. The visitor API is Laravel (routes/api.php) and
# is covered by tests/Feature/Api like everything else.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, gd, sodium, sqlite3, pdo_sqlite, zip
          coverage: none

      - name: Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Front-end build
        run: |
          npm ci
          npm run build

      - name: Environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Test suite
        run: php artisan test --compact

      - name: Service worker rules
        run: node --check public/visitor/sw.js && npm test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      # Fails on any known advisory in the locked versions - the same check
      # that cleared 45 advisories in commit 071f7cc, now run on every push.
      - name: Composer audit
        run: composer audit --locked

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: npm audit
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
